[package]
name = "felaris"
version = "0.3.1"
edition = "2024"

[dependencies]
wry = "0.57"
tao = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
# Experimental Servo engine; see docs/servo.md.
servo = { version = "0.7", default-features = false, features = ["bundled", "clipboard", "js_jit", "multiprocess", "webcrypto", "webgl", "brotli-compression-stream"], optional = true }
surfman = { version = "0.14", features = ["sm-angle-builtin", "sm-angle-default"], optional = true }
euclid = { version = "0.22", optional = true }
keyboard-types = { version = "0.8", optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"], optional = true }

[features]
servo = [
    "dep:servo",
    "dep:surfman",
    "dep:euclid",
    "dep:keyboard-types",
    "dep:rustls",
    "windows/Win32_System_Com",
    "windows/Win32_UI_Controls_Dialogs",
    "windows/Win32_UI_Shell_Common",
]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_SystemInformation","Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39"

[build-dependencies]
embed-resource = "3.0"

# Felaris patches to Servo crates; see vendor/README.md.
[patch.crates-io]
servo = { path = "vendor/servo" }
servo-constellation = { path = "vendor/servo-constellation" }
servo-embedder-traits = { path = "vendor/servo-embedder-traits" }
servo-net = { path = "vendor/servo-net" }
servo-net-traits = { path = "vendor/servo-net-traits" }
servo-script = { path = "vendor/servo-script" }
servo-storage = { path = "vendor/servo-storage" }
