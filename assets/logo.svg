<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Celestial Orbital Gradient -->
    <linearGradient id="felaris-orbit" x1="16" y1="16" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="38%" stop-color="#ffffff"/>
      <stop offset="72%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Aerodynamic F Glyphs Gradient -->
    <linearGradient id="felaris-stem" x1="30" y1="20" x2="68" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Polaris Star Aura -->
    <radialGradient id="felaris-star-aura" cx="78" cy="46" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Beacon Luminescence -->
  <circle cx="78" cy="46" r="16" fill="url(#felaris-star-aura)"/>

  <!-- Orbital Trajectory Crescent (Browser / Celestial Navigation Sweep) -->
  <path d="M 64 16 C 36 14 14 32 14 54 C 14 74 30 87 50 87 C 68 87 81 77 86 64 C 81 68 70 76 52 76 C 36 76 25 64 25 52 C 25 36 38 23 64 23 Z" 
        fill="url(#felaris-orbit)"/>

  <!-- Aerodynamic Feline Keel & F-Wings -->
  <path d="M 32 74 C 37 72 41 68 43 60 L 43 31 C 43 27 46 24 50 24 L 72 24 C 74 24 75 26 74 28 L 71 33 C 70 34.5 68.5 35 67 35 L 52 35 L 52 46 L 64 46 C 66 46 67 48 66 50 L 64 54 C 63 55.5 61.5 56 60 56 L 52 56 L 52 62 C 52 72 42 77 34 77 C 32 77 30 76.5 30 76.5 C 31 75.5 31.8 74.8 32 74 Z" 
        fill="url(#felaris-stem)"/>

  <!-- Polaris Star (Guiding North Star Beacon) -->
  <!-- Vertical Diamond Needle -->
  <path d="M 78 30 Q 78 42 74 46 Q 78 50 78 62 Q 78 50 82 46 Q 78 42 78 30 Z" fill="#38bdf8"/>
  <!-- Horizontal Diamond Needle -->
  <path d="M 62 46 Q 74 46 78 42 Q 82 46 94 46 Q 82 46 78 50 Q 74 46 62 46 Z" fill="#38bdf8"/>
  <!-- Diagonal Spark Beams -->
  <path d="M 70 38 L 86 54 M 86 38 L 70 54" stroke="#e0f2fe" stroke-width="1.2" opacity="0.8" stroke-linecap="round"/>
  <!-- Radiant Core -->
  <circle cx="78" cy="46" r="2.8" fill="#ffffff"/>
</svg>
