async function load(frame,file,common) {

 await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html.replace('__COMMON_SCRIPT__',common).replace('__SHORTCUTS__','[]');});

 if(frame.contentWindow.Felaris) {
  frame.contentWindow.Felaris.send=(action,payload={})=>messages.push({action,...payload});
  frame.contentWindow.Felaris.navigate=url=>messages.push({action:'navigate',url});
 }
}
