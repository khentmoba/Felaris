<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<style>
:root { color-scheme:dark; --bg:#0c0c0e; --surface:#1b1b1e; --hover:#27272b; --line:#3a3a40; --text:#f5f5f7; --muted:#b2b2b8; --accent:#dedee3; font-family:"Segoe UI",system-ui,sans-serif; }
* { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--text); background:var(--bg); display:flex; flex-direction:column; padding:28px 40px 20px; } button,input { font:inherit; } button,a { -webkit-tap-highlight-color:transparent; } button { cursor:pointer; } :focus-visible { outline:2px solid var(--accent); outline-offset:4px; } ::selection { background:#45454b; color:white; } svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
header { display:flex; justify-content:space-between; align-items:center; gap:16px; color:var(--muted); font-size:12px; } .wordmark { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:600; color:var(--text); } .wordmark svg { color:var(--accent); } time { font-variant-numeric:tabular-nums; }
main { flex:1; width:100%; max-width:640px; margin:0 auto; display:flex; flex-direction:column; justify-content:center; padding:64px 0 80px; }
h1 { font-size:clamp(30px,4vw,44px); font-weight:400; letter-spacing:-.035em; line-height:1.15; margin:0 0 12px; text-wrap:balance; } .intro { color:var(--muted); font-size:14px; margin:0 0 32px; line-height:1.5; }
form { display:flex; align-items:center; gap:12px; min-height:60px; padding:8px 10px 8px 20px; background:var(--surface); border:1px solid var(--line); border-radius:14px; } form:focus-within { border-color:var(--accent); } form>svg { color:var(--muted); flex-shrink:0; } input { width:100%; min-width:0; background:none; border:0; outline:0; color:var(--text); caret-color:var(--accent); font-size:15px; height:40px; } #search-input:focus-visible { outline:none; } input::placeholder { color:var(--muted); opacity:1; } .submit { display:grid; place-items:center; flex-shrink:0; width:40px; height:40px; border:0; border-radius:9px; color:#101011; background:var(--accent); } .submit:hover { background:#f5f5f7; }
.search-note { margin:10px 0 34px; font-size:12px; color:var(--muted); }
h2 { font-size:12px; font-weight:600; color:var(--muted); margin:0 0 14px; }
.shortcuts { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px 12px; } .shortcut { display:flex; flex-direction:column; align-items:center; gap:10px; text-decoration:none; color:var(--muted); font-size:12px; padding:8px 4px; border-radius:10px; } .shortcut:hover { background:var(--surface); color:var(--text); } .shortcut-icon { display:grid; place-items:center; width:44px; height:44px; border-radius:13px; background:var(--surface); color:var(--accent); } .shortcut-icon svg { width:21px; height:21px; } .shortcut:hover .shortcut-icon { background:var(--hover); }
footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; font-size:12px; color:var(--muted); line-height:1.5; } .keys { display:flex; flex-wrap:wrap; gap:16px; } kbd { font:10px "Segoe UI",sans-serif; border:1px solid var(--line); border-radius:4px; padding:2px 5px; margin-right:5px; }
form { transition:border-color 160ms ease,background-color 160ms ease; }
.shortcut,.shortcut-icon,.submit { transition:background-color 140ms ease,color 140ms ease,transform 100ms ease; }
.submit:active { transform:scale(.95); }
@media(prefers-reduced-motion:reduce) { .submit:active { transform:none; } }
@media(max-width:500px) { body { padding:22px; } header { font-size:12px; } main { padding:40px 0; } .shortcuts { grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; } form { padding-left:12px; gap:8px; } input { font-size:13px; } .intro { font-size:13px; } footer { flex-direction:column; } }
</style>
</head>
<body>
<header><span class="wordmark"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 20V4h13M6 11h10M10 20V4"/></svg>Felaris</span><time id="date"></time></header>
<main>
<h1>A little room to explore.</h1>
<p class="intro">Your next idea is a search away.</p>
<form id="search-form" role="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="search-input" aria-label="Search the web or enter address" placeholder="Search the web or enter address" autofocus autocomplete="off" spellcheck="false"><button class="submit" type="submit" aria-label="Search or navigate" title="Search or navigate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button></form>
<p class="search-note">Web searches use Brave Search</p>
<section aria-labelledby="shortcuts-heading"><h2 id="shortcuts-heading">Shortcuts</h2><div class="shortcuts">
<a class="shortcut" href="https://github.com"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 22v-4c-4 1-4-2-6-2m12 6v-4c0-1-.3-1.5-.7-2 3-.4 6-1.5 6-6 0-1.3-.5-2.5-1.3-3.4.2-1 .2-2-.3-3-1.5-.2-3 1-3.5 1.3a12 12 0 0 0-6.4 0C8 4.6 6.5 3.4 5 3.6c-.5 1-.5 2-.3 3C3.8 7.5 3.3 8.7 3.3 10c0 4.5 3 5.6 6 6-.4.5-.7 1-.7 2"/></svg></span>GitHub</a>
<a class="shortcut" href="https://doc.rust-lang.org/book/"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v15M12 5C8 3 5 3 2 4v14c4-1 7-1 10 2 3-3 6-3 10-2V4c-3-1-6-1-10 1Z"/></svg></span>Rust Docs</a>
<a class="shortcut" href="https://crates.io"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5Zm0 10v9M3 8l9 5 9-5M7.5 5.5l9 5"/></svg></span>Crates.io</a>
<a class="shortcut" href="https://search.brave.com"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg></span>Brave Search</a>
<a class="shortcut" href="https://youtube.com"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/></svg></span>YouTube</a>
<a class="shortcut" href="https://news.ycombinator.com"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 4 6 9 6-9m-6 9v7"/></svg></span>Hacker News</a>
<a class="shortcut" href="https://wikipedia.org"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m2 5 6 15 4-10 4 10 6-15M1 5h5m3 0h6m3 0h5m-9 0-2 5-2-5"/></svg></span>Wikipedia</a>
<a class="shortcut" href="https://reddit.com"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="9" ry="6"/><path d="m12 8 2-5 5 1M8 16c2 2 6 2 8 0"/><circle cx="8" cy="12" r="1"/><circle cx="16" cy="12" r="1"/><circle cx="20" cy="4" r="2"/></svg></span>Reddit</a>
</div></section>
</main>
<footer><span>Make space for what matters.</span><div class="keys"><span><kbd>Ctrl L</kbd>Address bar</span><span><kbd>Ctrl T</kbd>New tab</span><span><kbd>Ctrl S</kbd>Sidebar</span></div></footer>
<script>__COMMON_SCRIPT__</script>
<script>
const date=new Date();
const dateElement=document.getElementById('date');
dateElement.dateTime=date.toISOString().slice(0,10);
dateElement.textContent=date.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
document.getElementById('search-form').onsubmit=event=>{ event.preventDefault(); const url=Felaris.resolveAddress(document.getElementById('search-input').value); if(url) Felaris.navigate(url); };
document.querySelectorAll('.shortcut').forEach(link=>link.onclick=event=>{ event.preventDefault(); Felaris.navigate(link.href); });
</script>
</body>
</html>
