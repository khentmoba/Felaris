<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History</title>
<style>
:root { color-scheme:dark; --bg:#0c0c0e; --surface:#1b1b1e; --hover:#27272b; --active:#2e2e33; --line:#3a3a40; --text:#f5f5f7; --muted:#b2b2b8; --accent:#dedee3; font-family:"Segoe UI",system-ui,sans-serif; font-size:14px; }
* { box-sizing:border-box; } body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); padding:28px 40px; }
button,input { font:inherit; color:inherit; } button { cursor:pointer; border:0; background:none; border-radius:8px; } :focus-visible { outline:2px solid var(--accent); outline-offset:2px; } ::selection { background:#45454b; color:#fff; }
svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
[hidden] { display:none!important; }
main { max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
header { display:flex; align-items:center; justify-content:space-between; gap:16px; } h1 { font-size:26px; font-weight:600; letter-spacing:-.02em; margin:0; }
.btn { height:34px; padding:0 14px; background:var(--active); border:1px solid var(--line); font-size:13px; white-space:nowrap; } .btn:hover { background:var(--hover); border-color:var(--muted); } .btn:disabled { opacity:.5; cursor:default; }
.find { display:flex; align-items:center; gap:10px; height:42px; padding:0 14px; background:var(--surface); border:1px solid var(--line); border-radius:21px; color:var(--muted); } .find:focus-within { border-color:var(--accent); } .find input { flex:1; min-width:0; background:none; border:0; outline:0; caret-color:var(--accent); } .find input::placeholder { color:var(--muted); opacity:1; } .find svg { width:18px; height:18px; }
h2 { font-size:12px; font-weight:600; color:var(--muted); margin:10px 0 8px; text-transform:uppercase; letter-spacing:.06em; }
ul { list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
li { display:flex; align-items:center; border-bottom:1px solid var(--line); } li:last-child { border:0; } li:hover,li:focus-within { background:var(--hover); }
.visit { flex:1; min-width:0; display:flex; align-items:center; gap:12px; height:46px; padding:0 14px; text-align:left; border-radius:0; } .time { width:62px; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; flex-shrink:0; }
.visit .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .visit .host { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:2; }
.remove { width:32px; height:32px; margin-right:8px; display:grid; place-items:center; color:var(--muted); opacity:0; flex-shrink:0; } li:hover .remove,li:focus-within .remove { opacity:1; } .remove:hover { background:#45454b; color:var(--text); }
.empty { color:var(--muted); text-align:center; padding:56px 0; line-height:1.6; }
.btn,li,.remove { transition:background-color 140ms ease,border-color 140ms ease,color 140ms ease,opacity 120ms ease; }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
@media(max-width:560px) { body { padding:20px; } .visit .host { display:none; } }
@media(forced-colors:active) { .remove { opacity:1; } }
</style>
</head>
<body>
<main>
<header><h1>History</h1><button class="btn" id="clear">Clear history</button></header>
<label class="find"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="find" type="search" placeholder="Search history" aria-label="Search history" autocomplete="off" spellcheck="false" autofocus></label>
<div id="list"></div>
<p class="empty" id="empty" hidden></p>
</main>
<script>__COMMON_SCRIPT__</script>
<script>
let entries=__HISTORY__;
const saving=__SAVING__;
const $=id=>document.getElementById(id);
const dayLabel=time=>{ const day=new Date(time); const today=new Date(); const start=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(); const diff=Math.round((start(today)-start(day))/864e5); return diff===0?'Today':diff===1?'Yesterday':day.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:day.getFullYear()===today.getFullYear()?undefined:'numeric'}); };
const clock=time=>new Date(time).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
function hostOf(url) { try { return new URL(url).host.replace(/^www\./,''); } catch { return url; } }
function render() {
 const query=$('find').value.trim().toLowerCase();
 const shown=entries.filter(entry=>!query||(entry.title+' '+entry.url).toLowerCase().includes(query));
 const groups=new Map();
 for(const entry of shown) { const label=dayLabel(entry.time); if(!groups.has(label)) groups.set(label,[]); groups.get(label).push(entry); }
 const nodes=[];
 for(const [label,items] of groups) {
  const heading=document.createElement('h2'); heading.textContent=label;
  const list=document.createElement('ul');
  for(const entry of items) {
   const row=document.createElement('li');
   const open=document.createElement('button'); open.className='visit'; open.title=entry.url;
   const time=document.createElement('span'); time.className='time'; time.textContent=clock(entry.time);
   const name=document.createElement('span'); name.className='name'; name.textContent=entry.title||entry.url;
   const host=document.createElement('span'); host.className='host'; host.textContent=hostOf(entry.url);
   open.append(time,name,host); open.onclick=()=>Felaris.navigate(entry.url);
   const remove=document.createElement('button'); remove.className='remove'; remove.title='Remove from history'; remove.setAttribute('aria-label','Remove '+(entry.title||entry.url)+' from history');
   remove.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg>';
   remove.onclick=()=>{ Felaris.send('delete_history',{url:entry.url}); entries=entries.filter(item=>item.url!==entry.url); render(); };
   row.append(open,remove); list.append(row);
  }
  nodes.push(heading,list);
 }
 $('list').replaceChildren(...nodes);
 $('clear').disabled=!entries.length;
 const empty=$('empty'); empty.hidden=shown.length>0;
 empty.textContent=entries.length?'No history matches your search.':saving?'Pages you visit will show up here.':'History is turned off. Turn it on in Settings > Privacy and security.';
}
$('find').oninput=render;
$('find').onkeydown=e=>{ if(e.key==='Escape') { $('find').value=''; render(); } };
$('clear').onclick=()=>{ if(!confirm('Clear all browsing history?')) return; Felaris.send('clear_history'); entries=[]; render(); };
document.addEventListener('keydown',e=>{ if(e.ctrlKey&&!e.shiftKey&&!e.altKey&&e.key.toLowerCase()==='f') { e.preventDefault(); $('find').focus(); } });
render();
</script>
</body>
</html>
