name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust unit tests
        run: cargo test --locked
      - name: Windows install lifecycle
        run: powershell -NoProfile -File tests/install.test.ps1
      - name: Browser JS & repo hygiene checks
        run: node tests/browser.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package and exercise the release app
        run: powershell -NoProfile -File scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Felaris-Windows
          path: |
            target/release/felaris.exe
            target/release/felaris-setup.exe
            target/release/SHA256SUMS
