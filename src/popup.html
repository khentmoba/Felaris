<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Felaris Popup</title>
<style>
:root { color-scheme:dark; font-family:"Segoe UI",system-ui,sans-serif; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; overflow:hidden; background:#171719; color:#f5f5f7; user-select:none; }
.bar { position:relative; height:42px; display:flex; align-items:center; gap:6px; padding:0 8px; border-bottom:1px solid #2d2d33; }
.pill { flex:1; min-width:0; height:30px; display:flex; align-items:center; gap:8px; padding:0 6px 0 10px; background:#25252b; border:1px solid #383842; border-radius:8px; }
.pill>svg { width:14px; height:14px; color:#b2b2b8; flex-shrink:0; }
#address { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:#dedee3; user-select:text; }
button { width:24px; height:24px; border:0; border-radius:6px; background:none; color:#b2b2b8; display:grid; place-items:center; cursor:pointer; flex-shrink:0; }
button:hover { background:#34343c; color:#f5f5f7; }
button:focus-visible { outline:2px solid #dedee3; outline-offset:1px; }
svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
#progress { position:absolute; left:0; bottom:0; height:2px; width:100%; transform:scaleX(0); transform-origin:left; opacity:0; background:#dedee3; pointer-events:none; }
button { transition:background-color 160ms cubic-bezier(.2,0,0,1),color 160ms cubic-bezier(.2,0,0,1); }
@media(prefers-reduced-motion:reduce) { button { transition-duration:80ms; } }
</style>
</head>
<body>
<div class="bar">
<div class="pill">
<svg id="security-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
<span id="address" title="">Starting…</span>
<button id="expand" type="button" title="Open in main window" aria-label="Open in main window"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M14 10l3 3-3 3"/></svg></button>
</div>
<div id="progress"></div>
</div>
<script>
const send=(action,payload={})=>window.ipc?.postMessage(JSON.stringify({action,...payload}));
const address=document.getElementById('address');
const progress=document.getElementById('progress');
let currentUrl='';
let loadingNow=false;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
function animateLoading(on) {
 if(on===loadingNow) return;
 loadingNow=on;
 const style=getComputedStyle(progress);
 const from={transform:style.transform,opacity:style.opacity};
 progress.getAnimations().forEach(animation=>animation.cancel());
 progress.style.opacity=on?1:0;
 progress.style.transform=on?'scaleX(.72)':'scaleX(0)';
 if(reducedMotion.matches) return;
 if(on) progress.animate([{transform:'scaleX(.03)',opacity:1},{transform:'scaleX(.85)',opacity:1}],{duration:12000,easing:'cubic-bezier(.1,.6,.2,1)',fill:'forwards',id:'loading-progress'});
 else progress.animate([from,{transform:'scaleX(1)',opacity:1,offset:.35},{transform:'scaleX(1)',opacity:0}],{duration:420,easing:'cubic-bezier(.2,0,0,1)',id:'loading-progress'});
}
reducedMotion.addEventListener('change',()=>{
 progress.getAnimations().forEach(animation=>animation.cancel());
 progress.style.transform=loadingNow?'scaleX(.72)':'scaleX(0)';
 progress.style.opacity=loadingNow?1:0;
});
function formatPopupUrl(raw) {
 if(!raw||raw==='about:blank') return 'Waiting for page…';
 try {
  const parsed=new URL(raw);
  const host=parsed.host.replace(/^www\./,'');
  const path=parsed.pathname==='/'?'':parsed.pathname;
  return host+path+(parsed.search||'');
 } catch { return raw; }
}
window.setPopupState=(url,loading)=>{
 if(url) {
  currentUrl=url;
  address.textContent=formatPopupUrl(url);
  address.title=url;
 }
 animateLoading(loading);
};
document.getElementById('expand').onclick=()=>send('expand_popup',{url:currentUrl});
</script>
</body>
</html>
