<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<style>
:root { color-scheme:dark; --bg:#0c0c0e; --surface:#1b1b1e; --hover:#27272b; --line:#3a3a40; --text:#f5f5f7; --muted:#b2b2b8; --accent:#dedee3; font-family:"Segoe UI",system-ui,sans-serif; }
* { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--text); background:var(--bg); display:flex; flex-direction:column; padding:28px 40px 20px; } button,input { font:inherit; } button,a { -webkit-tap-highlight-color:transparent; } button { cursor:pointer; } :focus-visible { outline:2px solid var(--accent); outline-offset:4px; } ::selection { background:#45454b; color:white; } svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
header { display:flex; justify-content:space-between; align-items:center; gap:16px; color:var(--muted); font-size:12px; } .logo { width:38px; height:38px; display:block; flex-shrink:0; } .logo path,.logo circle { stroke:none; } time { font-variant-numeric:tabular-nums; }
main { flex:1; width:100%; max-width:640px; margin:0 auto; display:flex; flex-direction:column; justify-content:center; padding:64px 0 80px; }
h1 { font-size:clamp(30px,4vw,44px); font-weight:500; letter-spacing:-.035em; line-height:1.15; margin:0 0 12px; text-wrap:balance; } .intro { color:var(--muted); font-size:14px; margin:0 0 32px; line-height:1.5; }
form { display:flex; align-items:center; gap:12px; min-height:60px; padding:8px 10px 8px 20px; background:var(--surface); border:1px solid var(--line); border-radius:14px; } form:focus-within { border-color:var(--accent); } form>svg { color:var(--muted); flex-shrink:0; } input { width:100%; min-width:0; background:none; border:0; outline:0; color:var(--text); caret-color:var(--accent); font-size:15px; height:40px; } #search-input:focus-visible { outline:none; } input::placeholder { color:var(--muted); opacity:1; } .submit { display:grid; place-items:center; flex-shrink:0; width:40px; height:40px; border:0; border-radius:9px; color:#101011; background:var(--accent); } .submit:hover { background:#f5f5f7; }
.search-box { position:relative; }
#search-results { position:absolute; z-index:1; top:calc(100% + 6px); width:100%; max-height:320px; overflow:auto; padding:6px; border:1px solid var(--line); border-radius:12px; background:var(--surface); scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
.search-option { padding:10px 12px; border-radius:8px; cursor:pointer; }
.search-option[aria-selected="true"],.search-option:hover { background:var(--hover); }
.search-option span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; line-height:1.5; }
.search-option .detail { color:var(--muted); font-size:12px; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
.search-note { margin:10px 0 34px; font-size:12px; color:var(--muted); }
h2 { font-size:12px; font-weight:600; color:var(--muted); margin:0 0 14px; }
.shortcuts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 16px; } .shortcut { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--text); font-size:13px; min-height:56px; padding:8px 12px; border-radius:10px; text-align:left; } .shortcut:hover { background:var(--surface); } .shortcut-icon { display:grid; place-items:center; flex-shrink:0; width:32px; height:32px; color:var(--accent); font-size:15px; font-weight:600; } .shortcut-icon img { width:24px; height:24px; object-fit:contain; } .shortcut-icon svg { width:21px; height:21px; } .shortcut-label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .shortcut-visits { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; font-size:12px; color:var(--muted); line-height:1.5; } .keys { display:flex; flex-wrap:wrap; gap:16px; } kbd { font:10px "Segoe UI",sans-serif; border:1px solid var(--line); border-radius:4px; padding:2px 5px; margin-right:5px; }
form { transition:border-color 180ms cubic-bezier(.2,0,0,1),background-color 180ms cubic-bezier(.2,0,0,1); }
.shortcut,.shortcut-icon,.submit { transition:background-color 180ms cubic-bezier(.2,0,0,1),color 180ms cubic-bezier(.2,0,0,1),transform 180ms cubic-bezier(.16,1,.3,1); }
.submit:active { transform:scale(.97); transition-duration:70ms; }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:80ms!important; } .submit:active { transform:none; } }
@media(max-width:500px) { body { padding:22px; } header { font-size:12px; } .logo { width:32px; height:32px; } main { padding:40px 0; } .shortcuts { grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; } form { padding-left:12px; gap:8px; } input { font-size:13px; } .intro { font-size:13px; } footer { flex-direction:column; } }
@media(max-width:360px) { .shortcuts { grid-template-columns:minmax(0,1fr); } }
</style>
</head>
<body>
<header><svg class="logo" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Veluno"><title>Veluno</title>  <path fill="#F2EFE7" d="M176 242H298C312 242 322 249 328 263L493 650C498 663 505 670 513 670C522 670 530 662 536 648L679 310C696 270 725 242 770 242H848L632 746C610 797 570 824 517 824C463 824 421 797 399 746L176 242Z"/>
  <path fill="#F2EFE7" d="M848 242L752 466C723 535 677 573 611 573H568L616 459H636C654 459 667 446 676 424L712 338C728 299 731 269 716 254C732 246 750 242 770 242H848Z"/></svg><time id="date"></time></header>
<main>
<h1>A little room to explore.</h1>
<p class="intro">Your next idea is a search away.</p>
<div class="search-box">
<form id="search-form" role="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="search-input" role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false" aria-label="Search the web or enter address" placeholder="Search the web or enter address" autofocus autocomplete="off" spellcheck="false"><button class="submit" type="submit" aria-label="Search or navigate" title="Search or navigate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button></form>
<div id="search-results" role="listbox" aria-label="Search suggestions" hidden></div>
</div>
<div id="result-status" class="sr-only" role="status" aria-live="polite"></div>
<p class="search-note">Web searches use Brave Search</p>
<section aria-labelledby="shortcuts-heading"><h2 id="shortcuts-heading">Shortcuts</h2><div class="shortcuts" id="shortcuts">
<a class="shortcut" href="https://github.com"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 22v-4c-4 1-4-2-6-2m12 6v-4c0-1-.3-1.5-.7-2 3-.4 6-1.5 6-6 0-1.3-.5-2.5-1.3-3.4.2-1 .2-2-.3-3-1.5-.2-3 1-3.5 1.3a12 12 0 0 0-6.4 0C8 4.6 6.5 3.4 5 3.6c-.5 1-.5 2-.3 3C3.8 7.5 3.3 8.7 3.3 10c0 4.5 3 5.6 6 6-.4.5-.7 1-.7 2"/></svg></span><span class="shortcut-label">GitHub</span></a>
<a class="shortcut" href="https://doc.rust-lang.org/book/"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v15M12 5C8 3 5 3 2 4v14c4-1 7-1 10 2 3-3 6-3 10-2V4c-3-1-6-1-10 1Z"/></svg></span><span class="shortcut-label">Rust Docs</span></a>
<a class="shortcut" href="https://crates.io"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5Zm0 10v9M3 8l9 5 9-5M7.5 5.5l9 5"/></svg></span><span class="shortcut-label">Crates.io</span></a>
<a class="shortcut" href="https://search.brave.com"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg></span><span class="shortcut-label">Brave Search</span></a>
<a class="shortcut" href="https://youtube.com"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/></svg></span><span class="shortcut-label">YouTube</span></a>
<a class="shortcut" href="https://news.ycombinator.com"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 4 6 9 6-9m-6 9v7"/></svg></span><span class="shortcut-label">Hacker News</span></a>
<a class="shortcut" href="https://wikipedia.org"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m2 5 6 15 4-10 4 10 6-15M1 5h5m3 0h6m3 0h5m-9 0-2 5-2-5"/></svg></span><span class="shortcut-label">Wikipedia</span></a>
<a class="shortcut" href="https://reddit.com"><span class="shortcut-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="9" ry="6"/><path d="m12 8 2-5 5 1M8 16c2 2 6 2 8 0"/><circle cx="8" cy="12" r="1"/><circle cx="16" cy="12" r="1"/><circle cx="20" cy="4" r="2"/></svg></span><span class="shortcut-label">Reddit</span></a>
</div></section>
</main>
<footer><span>Make space for what matters.</span><div class="keys"><span><kbd>Ctrl L</kbd>Address bar</span><span><kbd>Ctrl T</kbd>New tab</span><span><kbd>Ctrl Shift B</kbd>Sidebar</span></div></footer>
<script>__COMMON_SCRIPT__</script>
<script>
document.querySelector('.search-note').textContent='Web searches use '+Veluno.searchName;
const date=new Date();
const dateElement=document.getElementById('date');
dateElement.dateTime=date.toISOString().slice(0,10);
dateElement.textContent=date.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
const input=document.getElementById('search-input');
const results=document.getElementById('search-results');
const suggestionState=__SHORTCUTS__;
let options=[];
let selected=-1;
let composing=false;
function closeSuggestions() {
 results.hidden=true;
 input.setAttribute('aria-expanded','false');
 input.removeAttribute('aria-activedescendant');
 document.getElementById('result-status').textContent='';
 selected=-1;
}
function selectSuggestion(index) {
 selected=index;
 [...results.children].forEach((row,i)=>row.setAttribute('aria-selected',String(i===selected)));
 if(selected>=0) {
  input.setAttribute('aria-activedescendant',results.children[selected].id);
  results.children[selected].scrollIntoView({block:'nearest'});
 } else input.removeAttribute('aria-activedescendant');
}
function renderSuggestions() {
 options=Veluno.suggestions(input.value,suggestionState,suggestionState.history);
 results.replaceChildren(...options.map((option,index)=>{
  const row=document.createElement('div');
  row.id='search-option-'+index; row.className='search-option';
  row.setAttribute('role','option'); row.setAttribute('aria-selected','false');
  const title=document.createElement('span'); title.textContent=option.title;
  const detail=document.createElement('span'); detail.className='detail'; detail.textContent=option.detail==='Open in a new tab'?'Open address':option.detail;
  row.append(title,detail);
  row.onmousedown=event=>event.preventDefault();
  row.onclick=()=>Veluno.navigate(option.url);
  return row;
 }));
 results.hidden=!options.length;
 input.setAttribute('aria-expanded',String(options.length>0));
 selectSuggestion(input.value.trim()?0:-1);
 document.getElementById('result-status').textContent=options.length?`${options.length} suggestions available`:'';
}
input.addEventListener('compositionstart',()=>{composing=true;});
input.addEventListener('compositionend',()=>{composing=false;renderSuggestions();});
input.addEventListener('input',renderSuggestions);
input.addEventListener('focus',renderSuggestions);
input.addEventListener('blur',closeSuggestions);
input.addEventListener('keydown',event=>{
 if(event.isComposing) return;
 if(event.key==='Escape') { event.preventDefault(); closeSuggestions(); }
 else if(['ArrowDown','ArrowUp'].includes(event.key)) {
  event.preventDefault();
  if(results.hidden) renderSuggestions();
  if(options.length) selectSuggestion(selected<0?(event.key==='ArrowDown'?0:options.length-1):(selected+(event.key==='ArrowDown'?1:-1)+options.length)%options.length);
 }
});
document.getElementById('search-form').onsubmit=event=>{
 event.preventDefault();
 if(composing) return;
 const url=(!results.hidden&&options[selected]?.url)||Veluno.resolveAddress(input.value);
 if(url) Veluno.navigate(url);
};
const iconMarkup={
 'github.com':'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 22v-4c-4 1-4-2-6-2m12 6v-4c0-1-.3-1.5-.7-2 3-.4 6-1.5 6-6 0-1.3-.5-2.5-1.3-3.4.2-1 .2-2-.3-3-1.5-.2-3 1-3.5 1.3a12 12 0 0 0-6.4 0C8 4.6 6.5 3.4 5 3.6c-.5 1-.5 2-.3 3C3.8 7.5 3.3 8.7 3.3 10c0 4.5 3 5.6 6 6-.4.5-.7 1-.7 2"/></svg>',
 'doc.rust-lang.org':'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v15M12 5C8 3 5 3 2 4v14c4-1 7-1 10 2 3-3 6-3 10-2V4c-3-1-6-1-10 1Z"/></svg>',
 'crates.io':'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5Zm0 10v9M3 8l9 5 9-5M7.5 5.5l9 5"/></svg>',
 'search.brave.com':'<svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg>',
 'youtube.com':'<svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/></svg>',
 'x.com':'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4l16 16M20 4 4 20"/></svg>',
 'news.ycombinator.com':'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 4 6 9 6-9m-6 9v7"/></svg>',
 'wikipedia.org':'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m2 5 6 15 4-10 4 10 6-15M1 5h5m3 0h6m3 0h5m-9 0-2 5-2-5"/></svg>',
 'reddit.com':'<svg aria-hidden="true" viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="9" ry="6"/><path d="m12 8 2-5 5 1M8 16c2 2 6 2 8 0"/><circle cx="8" cy="12" r="1"/><circle cx="16" cy="12" r="1"/><circle cx="20" cy="4" r="2"/></svg>',
};
window.renderShortcuts=items=>{
 if(!Array.isArray(items)||!items.length) return;
 const container=document.getElementById('shortcuts');
 document.getElementById('shortcuts-heading').textContent=items.some(item=>item.visits>0)?'Most visited':'Shortcuts';
 container.replaceChildren(...items.slice(0,8).map(item=>{
  const link=document.createElement('a');
  link.className='shortcut';
  link.href=item.url;
  link.title=item.visits>0?`${item.title} (${item.visits} ${item.visits===1?'visit':'visits'})`:item.title;
  const icon=document.createElement('span');
  icon.className='shortcut-icon';
  const host=(item.host||'').replace(/^www\./,'');
  if(iconMarkup[host]) icon.innerHTML=iconMarkup[host];
  else icon.textContent=(item.title||host||'?').charAt(0).toUpperCase();
  if(item.favicon) { const img=document.createElement('img'); img.src=item.favicon; img.alt=''; img.onload=()=>icon.replaceChildren(img); }
  const label=document.createElement('span');
  label.className='shortcut-label';
  label.textContent=item.title||host;
  link.append(icon,label);
  link.onclick=event=>{ event.preventDefault(); Veluno.navigate(link.href); };
  return link;
 }));
};
document.querySelectorAll('.shortcut').forEach(link=>link.onclick=event=>{ event.preventDefault(); Veluno.navigate(link.href); });
const initialShortcuts=suggestionState.shortcuts;
if(Array.isArray(initialShortcuts)&&initialShortcuts.length) window.renderShortcuts(initialShortcuts);
if(document.activeElement===input) renderSuggestions();
</script>
</body>
</html>
