[package]
name = "felaris"
version = "0.1.0"
edition = "2024"

[dependencies]
wry = "0.57"
tao = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39"

[build-dependencies]
embed-resource = "3.0"
